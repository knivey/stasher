name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go + web checks (vet, tests, typecheck, build)
        run: make check
      - name: Build binary
        run: go build -o stasher ./cmd/stasher
      - name: Chromium smoke (real binary, real SPA)
        run: ./scripts/smoke-web.sh
      - name: Authed browser smoke (login flow via puppeteer)
        run: cd web && node scripts/smoke-authed.mjs
